[project]
name = "tableaux"
version = "0.1.0"
description = "Semantic tableaux implementation"
readme = "README.md"
authors = [
    { name = "Mateus Cruzatto", email = "cruzatto@proton.me" }
]
requires-python = ">=3.11"
dependencies = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[project.scripts]
tableaux = "tableaux:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
